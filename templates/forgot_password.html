{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="container">
  <div class="auth-card">
    <p class="section-eyebrow mb-2">Account recovery</p>
    <h3 class="mb-4">Forgot Password</h3>
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" name="email" required autofocus>
      </div>
      <button type="submit" class="btn btn-twin w-100 mt-2">Send Reset Code</button>
    </form>
    <p class="text-center mt-3 mb-0"><a href="{{ url_for('login') }}">Back to login</a></p>
  </div>
</div>
{% endblock %}
