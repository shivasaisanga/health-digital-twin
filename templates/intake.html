{% extends "base.html" %}
{% block title %}Log Health Update{% endblock %}
{% block content %}
<div class="container py-4">
  <p class="section-eyebrow mb-2">Health check-in</p>
  <h3 class="mb-4">Update {{ user.name.split(' ')[0] }}'s Digital Twin</h3>

  <form method="POST" class="twin-card">
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">BMI</label>
        <input type="number" step="0.1" class="form-control" name="bmi" placeholder="e.g. 24.5" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Systolic BP (mmHg)</label>
        <input type="number" step="1" class="form-control" name="systolic_bp" placeholder="e.g. 120" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Diastolic BP (mmHg)</label>
        <input type="number" step="1" class="form-control" name="diastolic_bp" placeholder="e.g. 80" required>
      </div>

      <div class="col-md-4">
        <label class="form-label">Fasting Glucose (mg/dL)</label>
        <input type="number" step="1" class="form-control" name="glucose" placeholder="e.g. 95" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Average Sleep (hours/night)</label>
        <input type="number" step="0.1" class="form-control" name="sleep_hours" placeholder="e.g. 7.5" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Weekly Activity (minutes)</label>
        <input type="number" step="1" class="form-control" name="activity_min_per_week" placeholder="e.g. 150" required>
      </div>

      <div class="col-md-4">
        <label class="form-label">Water Intake (litres/day)</label>
        <input type="number" step="0.1" class="form-control" name="water_intake_l" placeholder="e.g. 2.0" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Diet Quality (1 = poor, 10 = excellent)</label>
        <input type="range" class="form-range" min="1" max="10" value="6" name="diet_quality" id="dietRange">
        <div class="slider-label"><span>1</span><span id="dietVal">6</span><span>10</span></div>
      </div>
      <div class="col-md-4">
        <label class="form-label">Stress Level (1 = low, 10 = high)</label>
        <input type="range" class="form-range" min="1" max="10" value="5" name="stress_level" id="stressRange">
        <div class="slider-label"><span>1</span><span id="stressVal">5</span><span>10</span></div>
      </div>

      <div class="col-12 d-flex gap-4 mt-2">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="smoking" id="smoking">
          <label class="form-check-label" for="smoking">I currently smoke</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="alcohol" id="alcohol">
          <label class="form-check-label" for="alcohol">I drink alcohol regularly</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="family_history" id="family_history">
          <label class="form-check-label" for="family_history">Family history of chronic disease</label>
        </div>
      </div>
    </div>

    <button type="submit" class="btn btn-twin mt-4 px-4">Generate my Health Score</button>
  </form>
</div>

<script>
  document.getElementById('dietRange').addEventListener('input', e => {
    document.getElementById('dietVal').textContent = e.target.value;
  });
  document.getElementById('stressRange').addEventListener('input', e => {
    document.getElementById('stressVal').textContent = e.target.value;
  });
</script>
{% endblock %}
