{% extends "base.html" %}
{% block title %}Enter OTP{% endblock %}
{% block content %}
<div class="container">
  <div class="auth-card text-center">
    <p class="section-eyebrow mb-2">Passwordless login</p>
    <h3 class="mb-2">Enter your OTP</h3>
    <p class="text-muted mb-4">Sent to <b>{{ email }}</b>. Valid for {{ validity }} minutes.</p>

    <form method="POST">
      <input type="text" class="form-control text-center mb-3" style="font-size:1.5rem; letter-spacing:0.5rem;"
             name="otp" maxlength="6" pattern="\d{6}" placeholder="------" autofocus required>
      <button type="submit" class="btn btn-twin w-100">Log in</button>
    </form>

    <p class="mt-3 mb-0">
      <a href="{{ url_for('login_otp_request') }}">Request a new OTP</a>
    </p>
  </div>
</div>
{% endblock %}
