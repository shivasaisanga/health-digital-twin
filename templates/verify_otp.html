{% extends "base.html" %}
{% block title %}Verify your email{% endblock %}
{% block content %}
<div class="container">
  <div class="auth-card text-center">
    <p class="section-eyebrow mb-2">Step 2 of 2</p>
    <h3 class="mb-2">Verify your email</h3>
    <p class="text-muted mb-4">We sent a 6-digit code to <b>{{ email }}</b>. It's valid for {{ validity }} minutes.</p>

    <form method="POST">
      <input type="text" class="form-control text-center mb-3" style="font-size:1.5rem; letter-spacing:0.5rem;"
             name="otp" maxlength="6" pattern="\d{6}" placeholder="------" autofocus required>
      <button type="submit" class="btn btn-twin w-100">Verify</button>
    </form>

    <p class="mt-3 mb-0">
      <a href="{{ url_for('resend_otp') }}">Resend OTP</a>
    </p>
  </div>
</div>
{% endblock %}
