{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="container">
  <div class="auth-card">
    <p class="section-eyebrow mb-2">Account recovery</p>
    <h3 class="mb-2">Reset Password</h3>
    <p class="text-muted mb-4">Enter the code sent to <b>{{ email }}</b> (valid {{ validity }} minutes) and your new password.</p>
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">OTP Code</label>
        <input type="text" class="form-control text-center" style="font-size:1.3rem; letter-spacing:0.4rem;"
               name="otp" maxlength="6" pattern="\d{6}" placeholder="------" required>
      </div>
      <div class="mb-3">
        <label class="form-label">New Password</label>
        <input type="password" class="form-control" name="password" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-twin w-100 mt-2">Reset Password</button>
    </form>
    <p class="text-center mt-3 mb-0"><a href="{{ url_for('forgot_password') }}">Request a new code</a></p>
  </div>
</div>
{% endblock %}
